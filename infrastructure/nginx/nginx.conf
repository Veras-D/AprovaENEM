user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'tenant="$http_x_tenant_slug" host="$host"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # Upstream Backend API Gateway (BFF)
    upstream frontend_api {
        server frontend-api:8080;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;

        # Multi-Tenant Wildcard Subdomain & Domain Ingress:
        # Matches:
        # - Default: localhost, aprovaenem.org, aprovaenem.com.br, aprovaenem.com
        # - Subdomains: seduc-sp.localhost, colegio-bandeirantes.aprovaenem.org, etc.
        # - Catch-all default server (_)
        server_name ~^(?:(?<tenant_slug>[a-z0-9-]+)\.)?(?<base_domain>aprovaenem\.(?:org|com\.br|com)|localhost)$
                    localhost
                    *.localhost
                    aprovaenem.org
                    *.aprovaenem.org
                    aprovaenem.com.br
                    *.aprovaenem.com.br
                    _;

        # Baseline Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://vlibras.gov.br; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-src 'self' https://vlibras.gov.br; object-src 'none'; base-uri 'self';" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Edge Health Check Probe
        location /health {
            access_log off;
            default_type text/plain;
            return 200 'healthy\n';
        }

        # Gateway Actuator Health Probe
        location /actuator/health {
            proxy_pass http://frontend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Slug $tenant_slug;
        }

        # Extracted ENEM Question Figures & Diagrams (Shared Named Volume: exam-assets-data)
        location /assets/questions/ {
            alias /usr/share/nginx/html/assets/questions/;
            autoindex off;
            expires 365d;

            # Re-declare security headers to prevent parent header wipe
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://vlibras.gov.br; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-src 'self' https://vlibras.gov.br; object-src 'none'; base-uri 'self';" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin *;
            try_files $uri =404;
        }

        # Hashed Vite Static Assets (JS chunks, CSS stylesheets, web fonts)
        location /assets/ {
            root /usr/share/nginx/html;
            expires 365d;
            access_log off;

            # Re-declare security headers to prevent parent header wipe
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://vlibras.gov.br; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-src 'self' https://vlibras.gov.br; object-src 'none'; base-uri 'self';" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Single Page Application HTML Entrypoint (Zero-Cache for Immediate Deployment Updates)
        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://vlibras.gov.br; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-src 'self' https://vlibras.gov.br; object-src 'none'; base-uri 'self';" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # BFF API Gateway Routing with Host & Tenant Header Forwarding
        location /api/ {
            proxy_pass http://frontend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Tenant-Slug $tenant_slug;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Swagger UI & OpenAPI 3.0 Interactive Documentation
        location ~ ^/(swagger-ui|v3/api-docs|webjars) {
            proxy_pass http://frontend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Slug $tenant_slug;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Path-Based Tenant Ingress (/t/{slug} and sub-paths) & SPA Client-Side Fallback
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
